name: Build Android Debug APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_latest_release:
        description: "Also attach JARVIS-debug.apk to GitHub Releases for direct phone download"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build JARVIS Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: 5. Set up Gradle 9.3.1 & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: 6. Prepare debug.keystore for SigningConfig
        run: |
          if [ -f "debug.keystore" ]; then
            echo "debug.keystore already exists."
          elif [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            tr -d '\n\r ' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            echo "Generating standard Android debug.keystore via keytool..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore

      - name: 7. Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            echo "Gradle wrapper JAR not found; using setup-gradle 9.3.1 binary..."
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: 8. Locate APK and Prepare JARVIS-debug.apk
        id: locate_apk
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ]; then
            FOUND_APK="$EXPECTED_APK"
          else
            FOUND_APK=$(find app/build/outputs/apk/debug -maxdepth 3 -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "::error::Debug APK was not found in app/build/outputs/apk/debug/"
            exit 1
          fi

          echo "Located Debug APK at: $FOUND_APK"
          cp "$FOUND_APK" "JARVIS-debug.apk"
          APK_SIZE=$(du -h "JARVIS-debug.apk" | cut -f1)
          APK_SHA256=$(sha256sum "JARVIS-debug.apk" | awk '{print $1}')

          echo "apk_path=JARVIS-debug.apk" >> "$GITHUB_OUTPUT"
          echo "source_apk=$FOUND_APK" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

          {
            echo "## ✅ JARVIS Debug APK Build Succeeded"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| **App Name** | JARVIS |"
            echo "| **Application ID** | \`com.aistudio.jarvisai.kxmpzq\` |"
            echo "| **Gradle Output Path** | \`$FOUND_APK\` |"
            echo "| **Artifact File Name** | \`JARVIS-debug.apk\` |"
            echo "| **APK File Size** | \`$APK_SIZE\` |"
            echo "| **SHA-256 Checksum** | \`$APK_SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 9. Upload JARVIS-debug.apk to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: JARVIS-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 10. Publish Direct Phone Download to GitHub Releases (latest-debug)
        if: >
          (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_latest_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: "JARVIS Debug APK (Latest Auto-Build)"
          body: |
            ### 📱 Direct Phone Download — JARVIS Debug APK
            Tap **`JARVIS-debug.apk`** below under **Assets** to download and install directly on your Android phone (Android 7.0+ / API 24–35).

            - **Application ID**: `com.aistudio.jarvisai.kxmpzq`
            - **Default AI Model**: `gemini-3.8-flash` (Optional Advanced: `gemini-4-argon`)
            - **Commit**: `${{ github.sha }}`
            - **APK Size**: `${{ steps.locate_apk.outputs.apk_size }}`
            - **SHA-256**: `${{ steps.locate_apk.outputs.apk_sha256 }}`
          prerelease: true
          files: JARVIS-debug.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
